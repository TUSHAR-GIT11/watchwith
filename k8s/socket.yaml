apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchwith-socket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchwith-socket
  template:
    metadata:
      labels:
        app: watchwith-socket
    spec:
      containers:
        - name: socket
          image: watchwith-socket:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: watchwith-socket
spec:
  type: NodePort
  selector:
    app: watchwith-socket
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30082
