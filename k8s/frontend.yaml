apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchwith-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchwith-frontend
  template:
    metadata:
      labels:
        app: watchwith-frontend
    spec:
      containers:
        - name: frontend
          image: watchwith-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: watchwith-frontend
spec:
  type: ClusterIP
  selector:
    app: watchwith-frontend
  ports:
    - port: 3000
      targetPort: 3000
